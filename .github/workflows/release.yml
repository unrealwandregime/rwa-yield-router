name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployed_url:
        description: Canonical HTTPS URL to smoke after an owner-authorized provider deployment
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          - service: web
            build_args: |
              APP_URL=${{ vars.PRODUCTION_URL }}
              NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
              NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          - service: worker
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          build-args: ${{ matrix.build_args }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rwa-yield-router-${{ matrix.service }}:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/rwa-yield-router-${{ matrix.service }}:latest

  smoke:
    needs: images
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployed_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
      - run: pnpm install --frozen-lockfile
      - env:
          SMOKE_BASE_URL: ${{ inputs.deployed_url }}
        run: pnpm smoke
