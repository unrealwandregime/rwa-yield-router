name: Release artifacts and smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      deployed_url:
        description: Canonical HTTPS URL to smoke after an owner-authorized provider deployment
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  manual_dispatch_guard:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the repository default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"

  images:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          - service: web
            build_args: |
              APP_URL=${{ vars.PRODUCTION_URL }}
              NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
              NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          - service: worker
            build_args: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify the validated commit is still the default-branch tip
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$VALIDATED_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          build-args: ${{ matrix.build_args }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rwa-yield-router-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}

  smoke:
    needs: manual_dispatch_guard
    if: ${{ github.event_name == 'workflow_dispatch' && needs.manual_dispatch_guard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify the dispatched commit is still the default-branch tip
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$DISPATCH_SHA"
      - name: Require successful CI for the dispatched commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          successful_runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch="$DEFAULT_BRANCH" \
            -f event=push \
            -f head_sha="$DISPATCH_SHA" \
            -f per_page=100 \
            -f status=success \
            --jq '.total_count')"
          test "$successful_runs" -gt 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0
      - run: pnpm install --frozen-lockfile
      - env:
          SMOKE_BASE_URL: ${{ inputs.deployed_url }}
        run: pnpm smoke
