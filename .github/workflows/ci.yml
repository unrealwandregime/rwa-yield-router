name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: rwa_yield_router_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rwa_yield_router_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_INTEGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/rwa_yield_router_integration_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/rwa_yield_router_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rwa_yield_router_test
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.17.0
      - run: pnpm install --frozen-lockfile
      - name: Create isolated integration database
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command "create database rwa_yield_router_integration_test"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm data:validate
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm test:integration
      - env:
          APP_URL: https://rwa-yield-router.example
          DATABASE_INTEGRATION_URL: ""
          DATABASE_MIGRATION_URL: ""
          DATABASE_URL: ""
          DEPLOYMENT_TIER: preview
          EMAIL_TRANSPORT: disabled
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key-not-a-secret
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.example
          NODE_ENV: production
          OBSERVABILITY_MODE: platform
          REDIS_URL: ""
        run: pnpm build
      - run: pnpm audit --audit-level high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 24.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --grep-invert @a11y
      - run: pnpm test:a11y
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          build-mode: none
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3

  container-security:
    name: Container scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            build_args: |
              APP_URL=https://rwa-yield-router.example
              NEXT_PUBLIC_SUPABASE_URL=https://ci.supabase.example
              NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-anon-key-not-a-secret
          - service: worker
            build_args: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          build-args: ${{ matrix.build_args }}
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: rwa-yield-router-${{ matrix.service }}:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          ignore-unfixed: false
          image-ref: rwa-yield-router-${{ matrix.service }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
