name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rwa_yield_router_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rwa_yield_router_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_INTEGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/rwa_yield_router_integration_test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/rwa_yield_router_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rwa_yield_router_test
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24.17.0
      - run: pnpm install --frozen-lockfile
      - name: Create isolated integration database
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command "create database rwa_yield_router_integration_test"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --audit-level high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project chromium
      - run: pnpm test:a11y --project chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
