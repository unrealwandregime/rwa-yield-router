name: Scheduled maintenance checks

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-and-live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm data:validate
      - if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: pnpm smoke
